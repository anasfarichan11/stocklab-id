<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StockLab ID</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#0f172a;
color:white;
padding:30px;
transition:.3s;
}

.container{
max-width:1200px;
margin:auto;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

h1{
font-size:32px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:20px;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
gap:20px;
}

input{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:10px;
border:none;
border-radius:10px;
}

button{
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
background:#2563eb;
color:white;
font-weight:bold;
}

button:hover{
background:#1d4ed8;
}

.result{
margin-top:15px;
padding:15px;
background:#0f172a;
border-radius:12px;
}

.light{
background:#f4f4f4;
color:#111;
}

.light .card{
background:white;
}

.green{
color:#22c55e;
font-weight:bold;
}

.red{
color:#ef4444;
font-weight:bold;
}

.yellow{
color:#facc15;
font-weight:bold;
}

</style>
</head>

<body>
<section id="landing">

<h1>📈 Stock Analyzer Pro</h1>

<p>
Analisis Fundamental dan Teknikal Saham Indonesia
berbasis data laporan keuangan.
</p>

<button onclick="showAnalyzer()">
Mulai Analisis
</button>

</section>
  
<div class="container" id="analyzer">

<header>
<h1> StockLab ID</h1>

<button onclick="toggleTheme()">
🌙 Theme
</button>
</header>

<<div class="card">

<h2>Fundamental Analyzer</h2>

<input id="price" placeholder="Harga Saham">

<input id="eps" placeholder="EPS">

<input id="bvps" placeholder="BVPS">

<input id="roe" placeholder="ROE (%)">

<input id="der" placeholder="DER">

<button onclick="analyzeFundamental()">
Analisis Fundamental
</button>

<div id="fundamentalResult"
class="result">
Masukkan data...
</div>

</div>

<div class="card">

<h2>Technical Analyzer</h2>

<input id="rsi" placeholder="RSI">

<input id="ma20" placeholder="MA20">

<input id="ma50" placeholder="MA50">

<button onclick="analyzeTechnical()">
Analisis Teknikal
</button>

<div id="technicalResult"
class="result">
Masukkan data...
</div>

</div>

</div>

</div>

</div>

</div>

<div class="card">

<h2>⭐ Watchlist</h2>

<input
id="stockInput"
placeholder="Kode Saham (BBCA)"
>

<button onclick="addWatchlist()">
Tambah Saham
</button>

<div
id="watchlist"
class="result"
>

Belum ada saham

</div>

</div>

<script>

function toggleTheme(){
document.body.classList.toggle("light");
}

function analyzeFundamental(){

let price =
parseFloat(document.getElementById("price").value);

let eps =
parseFloat(document.getElementById("eps").value);

let bvps =
parseFloat(document.getElementById("bvps").value);

let roe =
parseFloat(document.getElementById("roe").value);

let der =
parseFloat(document.getElementById("der").value);

let per = price / eps;

let pbv = price / bvps;

let fairValue = eps * 15;

let marginSafety =
((fairValue - price) / fairValue) * 100;

let graham =
Math.sqrt(22.5 * eps * bvps);

let score = 0;

if(roe >= 15) score += 25;
if(der <= 1) score += 25;
if(per <= 15) score += 25;
if(pbv <= 3) score += 25;

let strengths = [];

if(roe >= 15)
strengths.push("✅ ROE tinggi");

if(der <= 1)
strengths.push("✅ DER sehat");

if(per <= 15)
strengths.push("✅ PER menarik");

if(pbv <= 3)
strengths.push("✅ PBV wajar");
``

let status = "";
let category = "";
let strengths = [];
  
if(score >= 75){

status =
"<span class='green'>BUY ✅</span>";

category =
"<span class='green'>Excellent</span>";

}
else if(score >= 50){

status =
"<span class='yellow'>HOLD ⚠️</span>";

category =
"<span class='yellow'>Good</span>";

}
else{

status =
"<span class='red'>SELL ❌</span>";

category =
"<span class='red'>Poor</span>";

}
if(score >= 75){

conclusion =
strengths.join("<br>") +
"<br><br>" +
"Saham memiliki fundamental yang cukup baik berdasarkan data yang dimasukkan.";

}
else if(score >= 50){

conclusion =
"⚠️ Fundamental cukup baik.<br>" +
"Masih ada beberapa aspek yang perlu diperhatikan sebelum membeli saham ini.";

}
else{

conclusion =
"❌ Fundamental kurang menarik.<br>" +
"Risiko relatif tinggi dan perlu analisis lebih lanjut.";

}
document.getElementById(
"fundamentalResult"
).innerHTML =

`
PER : ${per.toFixed(2)} <br><br>

PBV : ${pbv.toFixed(2)} <br><br>

Fair Value :
Rp ${fairValue.toLocaleString()} <br><br>

Graham Number :
${graham.toFixed(2)} <br><br>

ROE :
${roe}% <br><br>

DER :
${der} <br><br>

Margin of Safety :
${marginSafety.toFixed(2)}% <br><br>

Stock Score :
${score}/100 <br><br>

Kategori :
${category} <br><br>

Status :

${status}

<br><br>

Kesimpulan :

<br><br>

${conclusion}

`;

}

function analyzeTechnical(){

let rsi =
parseFloat(document.getElementById("rsi").value);

let ma20 =
parseFloat(document.getElementById("ma20").value);

let ma50 =
parseFloat(document.getElementById("ma50").value);

let signal="";

if(rsi < 30 && ma20 > ma50){

signal=
"<span class='green'>BUY 🚀</span>";

}
else if(rsi > 70){

signal=
"<span class='red'>SELL 🔻</span>";

}
else{

signal=
"<span class='yellow'>HOLD ⏳</span>";

}

let trend =
ma20 > ma50
?
"Bullish 📈"
:
"Bearish 📉";

document.getElementById(
"technicalResult"
).innerHTML =

`
Trend :
${trend}
<br><br>

RSI :
${rsi}
<br><br>

MA20 :
${ma20}
<br><br>

MA50 :
${ma50}
<br><br>

Signal :
${signal}

`;

}
function addWatchlist(){

let stock =
document.getElementById("stockInput")
.value.toUpperCase();

if(!stock) return;

let data =
JSON.parse(
localStorage.getItem("watchlist")
) || [];

data.push(stock);

localStorage.setItem(
"watchlist",
JSON.stringify(data)
);

renderWatchlist();

document.getElementById(
"stockInput"
).value = "";

}

function renderWatchlist(){

let data =
JSON.parse(
localStorage.getItem("watchlist")
) || [];

let html = "";

if(data.length === 0){

html = "Belum ada saham";

}else{

data.forEach(stock=>{

html += `
<div style="
display:flex;
gap:10px;
margin-bottom:10px;
">

<button
onclick="loadStock('${stock}')"
style="
width:auto;
padding:10px 15px;
"
>
📈 ${stock}
</button>

<button
onclick="deleteStock('${stock}')"
style="
width:auto;
background:#ef4444;
padding:10px 15px;
"
>
❌
</button>

</div>
`;

});

}

document.getElementById(
"watchlist"
).innerHTML = html;

}
}

function deleteStock(stock){

let data =
JSON.parse(
localStorage.getItem("watchlist")
) || [];

data = data.filter(
item => item !== stock
);

localStorage.setItem(
"watchlist",
JSON.stringify(data)
);

renderWatchlist();

}

function loadStock(stock){

alert("Memuat data " + stock);

}

window.onload = function(){

renderWatchlist();

}</script>

</body>
</html>
